name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: pnpm -r --if-present run prisma:generate

      - name: Build workspace
        run: pnpm build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: pnpm -r --if-present run prisma:generate

      - name: Build workspace
        run: pnpm build

      - name: User service unit tests
        run: pnpm --dir services/user-service exec vitest run tests/unit

      - name: Event service unit tests
        run: pnpm --dir services/event-service exec vitest run tests/unit

      - name: Booking service unit tests
        run: pnpm --dir services/booking-service exec vitest run tests/unit

      - name: Notification service tests
        run: pnpm --dir services/notification-service exec vitest run

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: pnpm -r --if-present run prisma:generate

      - name: Build workspace
        run: pnpm build

      - name: User service integration tests
        run: pnpm --dir services/user-service exec vitest run tests/integration

      - name: Event service integration tests
        run: pnpm --dir services/event-service exec vitest run tests/integration tests/concurrency

      - name: Booking service integration tests
        run: pnpm --dir services/booking-service exec vitest run tests/integration

  helm-lint:
    name: Helm Lint & Template Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm Chart
        run: helm lint infrastructure/helm/event-booking

      - name: Validate Helm Template
        run: helm template event-booking infrastructure/helm/event-booking -f infrastructure/helm/event-booking/values-minikube.yaml

