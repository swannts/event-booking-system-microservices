name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.14.0
  NODE_VERSION: 22

jobs:
  quality:
    name: Quality, Build, and Service Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma clients
        run: pnpm -r --if-present run prisma:generate
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Run unit and service integration tests
        run: pnpm test

  migration-concurrency:
    name: Migration and PostgreSQL Concurrency Safety
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm build
      - name: Verify fresh and upgrade migrations
        run: pnpm test:migrations
      - name: Run real PostgreSQL concurrency tests
        run: >-
          pnpm --dir services/event-service exec vitest run tests/concurrency/seat-reservation.test.ts &&
          pnpm --dir services/booking-service exec vitest run tests/concurrency/outbox-dispatcher.test.ts

  compose-e2e:
    name: Compose Booking, Cancellation, and Concurrency E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Docker Compose E2E suite
        run: pnpm test:e2e
      - name: Capture Compose logs
        if: failure()
        run: docker compose logs --no-color > compose-e2e.log
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-e2e-logs
          path: compose-e2e.log
          if-no-files-found: ignore
      - name: Tear down Compose
        if: always()
        run: docker compose down -v --remove-orphans

  load-smoke:
    name: k6 Load Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Start the Compose stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Run CI-sized k6 profile
        run: docker run --rm --network host -i grafana/k6:latest run -e PROFILE=smoke - < tests/load/booking-load.js
      - name: Capture Compose logs
        if: failure()
        run: docker compose logs --no-color > compose-load-smoke.log
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-load-smoke-logs
          path: compose-load-smoke.log
          if-no-files-found: ignore
      - name: Tear down Compose
        if: always()
        run: docker compose down -v --remove-orphans

  docker-images:
    name: Build Runtime Images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: [user-service, event-service, booking-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: event-booking/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Helm Lint and Environment Rendering
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Lint chart
        run: helm lint infrastructure/helm/event-booking
      - name: Render dev
        run: helm template event-booking infrastructure/helm/event-booking -f infrastructure/helm/event-booking/values-dev.yaml > /dev/null
      - name: Render staging
        run: helm template event-booking infrastructure/helm/event-booking -f infrastructure/helm/event-booking/values-staging.yaml > /dev/null
      - name: Render production
        run: helm template event-booking infrastructure/helm/event-booking -f infrastructure/helm/event-booking/values-prod.yaml > /dev/null
      - name: Render Minikube
        run: helm template event-booking infrastructure/helm/event-booking -f infrastructure/helm/event-booking/values-minikube.yaml > /dev/null

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keep the advisory visible without making registry availability or the
    # current Prisma CLI-only transitive advisory a flaky PR blocker.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

# A container scanner is intentionally omitted from required PR checks: scanners that
# download a vulnerability database during each run add a network-dependent failure
# mode. Runtime images remain matrix-built here and can be scanned in registry policy.
