apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  NODE_ENV: production
  LOG_LEVEL: info
  USER_PORT: "3000"
  EVENT_PORT: "3001"
  BOOKING_PORT: "3002"
  NOTIFICATION_PORT: "3003"
  USER_DATABASE_URL: file:/data/dev.db
  EVENT_DATABASE_URL: postgresql://postgres:postgres@event-db:5432/event_booking
  BOOKING_DATABASE_URL: postgresql://postgres:postgres@booking-db:5432/event_booking
  REDIS_URL: redis://redis:6379
  KAFKA_BROKERS: kafka:9092
  EVENT_CACHE_TTL_SECONDS: "120"
