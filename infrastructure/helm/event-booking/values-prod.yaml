global:
  nodeEnv: production
  logLevel: warn

images:
  userService:
    repository: registry.example.com/event-booking/user-service
    tag: sha-000000000000
  eventService:
    repository: registry.example.com/event-booking/event-service
    tag: sha-000000000000
  bookingService:
    repository: registry.example.com/event-booking/booking-service
    tag: sha-000000000000
  notificationService:
    repository: registry.example.com/event-booking/notification-service
    tag: sha-000000000000

secrets:
  create: false
  existingSecret: event-booking-production-secrets

userService:
  replicaCount: 3
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

eventService:
  replicaCount: 3
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

bookingService:
  replicaCount: 3
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

notificationService:
  replicaCount: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
