namespace: event-booking

nameOverride: ""
fullnameOverride: ""

global:
  nodeEnv: production
  logLevel: info

secrets:
  create: true
  existingSecret: ""

securityContext:
  application:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  migration:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]

images:
  userService:
    repository: event-booking/user-service
    tag: latest
    pullPolicy: IfNotPresent
  eventService:
    repository: event-booking/event-service
    tag: latest
    pullPolicy: IfNotPresent
  bookingService:
    repository: event-booking/booking-service
    tag: latest
    pullPolicy: IfNotPresent
  notificationService:
    repository: event-booking/notification-service
    tag: latest
    pullPolicy: IfNotPresent
  postgres:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  redis:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  kafka:
    repository: apache/kafka
    tag: "4.0.0"
    pullPolicy: IfNotPresent

userService:
  replicaCount: 1
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    liveness:
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6

eventService:
  replicaCount: 1
  port: 3001
  cacheTtlSeconds: 120
  rateLimitWindowSeconds: 60
  rateLimitMaxRequests: 100
  trustProxy: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    readiness:
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6

bookingService:
  replicaCount: 1
  port: 3002
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    readiness:
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6

notificationService:
  replicaCount: 1
  port: 3003
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  probes:
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    liveness:
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6

databases:
  postgres:
    database: event_booking
    username: postgres
    password: postgres

userDb:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 2Gi
  service:
    port: 5432
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

eventDb:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 2Gi
  service:
    port: 5432
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

bookingDb:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 2Gi
  service:
    port: 5432
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

notificationDb:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 2Gi
  service:
    port: 5432
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  port: 6379
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

kafka:
  service:
    port: 9092
    controllerPort: 9093
  clientIds:
    eventService: event-service
    bookingService: booking-service
    notificationService: notification-service
  groupIds:
    eventService: event-service-consumers
    bookingService: booking-service-consumers
    notificationService: notification-service-consumers
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
