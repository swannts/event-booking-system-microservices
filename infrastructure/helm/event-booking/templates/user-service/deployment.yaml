apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "event-booking.componentFullname" (dict "root" . "component" "user-service") }}
  namespace: {{ include "event-booking.namespace" . }}
  labels:
    {{- include "event-booking.labels" . | nindent 4 }}
    app.kubernetes.io/component: user-service
spec:
  replicas: {{ .Values.userService.replicaCount }}
  selector:
    matchLabels:
      {{- include "event-booking.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: user-service
  template:
    metadata:
      labels:
        {{- include "event-booking.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: user-service
    spec:
      containers:
        - name: user-service
          image: "{{ .Values.images.userService.repository }}:{{ .Values.images.userService.tag }}"
          imagePullPolicy: {{ .Values.images.userService.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.userService.port }}
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "event-booking.fullname" . }}-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "event-booking.fullname" . }}-config
                  key: USER_PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "event-booking.fullname" . }}-secret
                  key: USER_DATABASE_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "event-booking.fullname" . }}-config
                  key: LOG_LEVEL
          volumeMounts:
            - name: user-service-data
              mountPath: {{ .Values.userService.persistence.mountPath }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: {{ .Values.userService.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.userService.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.userService.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.userService.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: {{ .Values.userService.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.userService.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.userService.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.userService.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.userService.resources | nindent 12 }}
      volumes:
        - name: user-service-data
          persistentVolumeClaim:
            claimName: {{ include "event-booking.componentFullname" (dict "root" . "component" "user-service") }}-data

