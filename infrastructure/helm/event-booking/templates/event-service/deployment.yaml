apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "event-booking.componentFullname" (dict "root" . "component" "event-service") }}
  namespace: {{ include "event-booking.namespace" . }}
  labels:
    {{- include "event-booking.labels" . | nindent 4 }}
    app.kubernetes.io/component: event-service
spec:
  replicas: {{ .Values.eventService.replicaCount }}
  selector:
    matchLabels:
      {{- include "event-booking.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: event-service
  template:
    metadata:
      labels:
        {{- include "event-booking.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: event-service
    spec:
      initContainers:
        - name: wait-for-event-db
          image: "{{ .Values.images.postgres.repository }}:{{ .Values.images.postgres.tag }}"
          imagePullPolicy: {{ .Values.images.postgres.pullPolicy }}
          command:
            - sh
            - -ec
            - until pg_isready -h {{ include "event-booking.componentFqdn" (dict "root" . "component" "event-db") }} -p {{ int .Values.eventDb.service.port }} -U {{ .Values.databases.postgres.username }} -d {{ .Values.databases.postgres.database }}; do echo waiting for event-db; sleep 2; done
        - name: migrate-event-db
          image: "{{ .Values.images.eventService.repository }}:{{ .Values.images.eventService.tag }}"
          imagePullPolicy: {{ .Values.images.eventService.pullPolicy }}
          command:
            - sh
            - -lc
            - corepack pnpm --dir services/event-service exec prisma migrate deploy
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "event-booking.fullname" . }}-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "event-booking.fullname" . }}-secret
                  key: EVENT_DATABASE_URL
        - name: wait-for-redis
          image: "{{ .Values.images.redis.repository }}:{{ .Values.images.redis.tag }}"
          imagePullPolicy: {{ .Values.images.redis.pullPolicy }}
          command:
            - sh
            - -ec
            - until redis-cli -h {{ include "event-booking.componentFqdn" (dict "root" . "component" "redis") }} -p {{ int .Values.redis.port }} ping >/dev/null 2>&1; do echo waiting for redis; sleep 2; done
        - name: wait-for-kafka
          image: "{{ .Values.images.kafka.repository }}:{{ .Values.images.kafka.tag }}"
          imagePullPolicy: {{ .Values.images.kafka.pullPolicy }}
          command:
            - sh
            - -ec
            - until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server {{ include "event-booking.componentFqdn" (dict "root" . "component" "kafka") }}:{{ int .Values.kafka.service.port }} >/dev/null 2>&1; do echo waiting for kafka; sleep 2; done
      containers:
        - name: event-service
          image: "{{ .Values.images.eventService.repository }}:{{ .Values.images.eventService.tag }}"
          imagePullPolicy: {{ .Values.images.eventService.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.eventService.port }}
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "event-booking.fullname" . }}-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "event-booking.fullname" . }}-config
                  key: EVENT_PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "event-booking.fullname" . }}-secret
                  key: EVENT_DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "event-booking.fullname" . }}-config
                  key: REDIS_URL
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "event-booking.fullname" . }}-config
                  key: KAFKA_BROKERS
            - name: KAFKA_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "event-booking.fullname" . }}-config
                  key: EVENT_KAFKA_CLIENT_ID
            - name: KAFKA_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "event-booking.fullname" . }}-config
                  key: EVENT_KAFKA_GROUP_ID
            - name: CACHE_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "event-booking.fullname" . }}-config
                  key: EVENT_CACHE_TTL_SECONDS
            - name: RATE_LIMIT_WINDOW_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "event-booking.fullname" . }}-config
                  key: RATE_LIMIT_WINDOW_SECONDS
            - name: RATE_LIMIT_MAX_REQUESTS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "event-booking.fullname" . }}-config
                  key: RATE_LIMIT_MAX_REQUESTS
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "event-booking.fullname" . }}-config
                  key: LOG_LEVEL
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: {{ .Values.eventService.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.eventService.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.eventService.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.eventService.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: {{ .Values.eventService.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.eventService.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.eventService.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.eventService.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.eventService.resources | nindent 12 }}
