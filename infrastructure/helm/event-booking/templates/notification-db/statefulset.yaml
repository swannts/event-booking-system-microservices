apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "event-booking.componentFullname" (dict "root" . "component" "notification-db") }}
  namespace: {{ include "event-booking.namespace" . }}
  labels:
    {{- include "event-booking.labels" . | nindent 4 }}
    app.kubernetes.io/component: notification-db
spec:
  serviceName: {{ include "event-booking.componentFullname" (dict "root" . "component" "notification-db") }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "event-booking.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: notification-db
  template:
    metadata:
      labels:
        {{- include "event-booking.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: notification-db
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.images.postgres.repository }}:{{ .Values.images.postgres.tag }}"
          imagePullPolicy: {{ .Values.images.postgres.pullPolicy }}
          ports:
            - name: postgres
              containerPort: {{ .Values.notificationDb.service.port }}
          envFrom:
            - secretRef:
                name: {{ include "event-booking.secretName" . }}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.notificationDb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.notificationDb.accessModes | nindent 10 }}
        {{- if .Values.notificationDb.storageClassName }}
        storageClassName: {{ .Values.notificationDb.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.notificationDb.size | quote }}
