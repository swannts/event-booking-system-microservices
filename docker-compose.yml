services:
  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: event_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  event-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: event_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - event-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  booking-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: event_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_CONFIG_DIR: /var/lib/kafka-config
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 10

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@user-db:5432/event_booking
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      user-db:
        condition: service_healthy
      user-service-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  user-service-migrate:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@user-db:5432/event_booking
    depends_on:
      user-db:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "/app/services/user-service/node_modules/.bin/prisma migrate deploy --schema /app/services/user-service/prisma/schema.prisma"
      ]
    restart: "no"

  event-service:
    build:
      context: .
      dockerfile: services/event-service/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@event-db:5432/event_booking
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: event-service
      KAFKA_GROUP_ID: event-service-consumers
      CACHE_TTL_SECONDS: 120
      LOG_LEVEL: info
    ports:
      - "3001:3001"
    depends_on:
      event-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      event-service-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3001/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  event-service-migrate:
    build:
      context: .
      dockerfile: services/event-service/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@event-db:5432/event_booking
    depends_on:
      event-db:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "/app/services/event-service/node_modules/.bin/prisma migrate deploy --schema /app/services/event-service/prisma/schema.prisma"
      ]
    restart: "no"

  booking-service:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://postgres:postgres@booking-db:5432/event_booking
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: booking-service
      KAFKA_GROUP_ID: booking-service-consumers
      LOG_LEVEL: info
    ports:
      - "3002:3002"
    depends_on:
      booking-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      booking-service-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3002/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  booking-service-migrate:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@booking-db:5432/event_booking
    depends_on:
      booking-db:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "/app/services/booking-service/node_modules/.bin/prisma migrate deploy --schema /app/services/booking-service/prisma/schema.prisma"
      ]
    restart: "no"

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3003
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: notification-service
      KAFKA_GROUP_ID: notification-service-consumers
      LOG_LEVEL: info
    ports:
      - "3003:3003"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3003/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  user-db-data:
  event-db-data:
  booking-db-data:
  redis-data:
